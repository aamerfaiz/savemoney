name: Android APK Build

# Builds the mobile app's Android APK directly via Gradle, bypassing EAS's
# build queue entirely. Runs on GitHub's own runners, which have normal
# internet access (unlike the sandbox this workflow was authored in, whose
# network policy blocks api.expo.dev, expo.dev, and dl.google.com).
#
# Signing: uses the auto-generated debug keystore that `expo prebuild`
# writes into the native project (apps/mobile/android/app/build.gradle's
# `release` build type points at `signingConfigs.debug`). That produces a
# real, installable, sideloadable APK — equivalent to eas.json's `preview`
# profile (internal distribution). Swap in a real release keystore (via
# GitHub Secrets) before any Play Store submission.

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        # Restricted to arm64-v8a only — the ABI virtually every phone
        # since ~2017 uses. The default build compiles native code (incl.
        # react-native-quick-crypto's real OpenSSL-based C++, not a thin
        # wrapper) for all 4 ABIs including the two emulator-only ones
        # (x86/x86_64), which was taking multiple hours on this runner.
        # Add armeabi-v7a back here (comma-separated) if you need to
        # support older 32-bit devices too.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-os-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
